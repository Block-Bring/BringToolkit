name: "✨ 功能建议"
description: 建议一个新功能
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        想到什么好点子？尽管说！虽然我不一定能全部实现，但每一条建议都会认真看～

  - type: textarea
    id: problem
    attributes:
      label: 解决了什么问题
      description: 这个功能是为了解决什么痛点？或者单纯想加个好玩的东西？
      placeholder: 每次手动做 XXX 很麻烦...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望这个功能怎样工作？
      placeholder: 如果能自动 XXX，点击按钮就能 YYY...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 有没有想过其他实现方式？

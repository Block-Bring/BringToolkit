name: "🐛 Bug 反馈"
description: 报告一个 Bug 帮助我们改进
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间反馈问题！请尽量详细描述，方便我定位和修复。

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 发生了什么？你期望的结果是什么？
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 如何复现这个问题？
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 报错 ...
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / 日志
      description: 如果方便，请附上报错截图或 `data/latest.log` 的内容。
      render: text

  - type: input
    id: version
    attributes:
      label: 版本号
      description: 你使用的是哪个版本？（可在关于页面查看）
      placeholder: 例如 1.0.0a5
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - 其他
    validations:
      required: true

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bring-toolkit"
version = "1.0.0a5"
description = "一个为 Minecraft 玩家打造的工具箱"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Block-Bring"},
]
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.10.2",
    "requests>=2.32.5",
    "packaging>=23.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.5",
]

[tool.setuptools.packages.find]
include = ["core*", "views*", "features*", "utils*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "RUF100"]
ignore = ["BLE001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
ignore_missing_imports = true
disallow_any_unimported = false
disallow_untyped_calls = false
disallow_untyped_defs = false
